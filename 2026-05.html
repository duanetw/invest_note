<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>invest_note</title><style>
:root{--bg:#141110;--card:#1e1a18;--line:#332c28;--fg:#e8ded4;--dim:#9a8d82;
--gold:#d9b26a;--up:#e06c5a;--down:#4fa87d;--fix:#c98b3f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
h1 a{color:var(--gold);text-decoration:none}
h1 a:hover{opacity:.75}
.sub{color:var(--dim);font-size:13px;margin-bottom:26px}
.day{color:var(--gold);font-size:13px;letter-spacing:1px;margin:30px 0 12px;
border-bottom:1px solid var(--line);padding-bottom:6px}
.day span{color:var(--dim);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:16px 18px;margin-bottom:14px}
.card.fixed{border-color:#5a4426}
.card h2{font-size:16px;margin:0 0 10px;font-weight:600;line-height:1.5}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
margin-right:6px;vertical-align:2px}
.b-new{background:#2c3a30;color:#7fc79b;border:1px solid #3d5544}
.b-fix{background:#3a2f1e;color:var(--fix);border:1px solid #5a4426}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
background:#2e2622;color:var(--gold);border:1px solid var(--line);margin-right:6px;
vertical-align:2px}
.pub{color:#6f635a;font-size:11.5px;font-weight:400;margin-left:4px}
.fix{background:#241d13;border-left:3px solid var(--fix);border-radius:0 6px 6px 0;
padding:10px 14px;margin:0 0 12px}
.fix b{color:var(--fix);font-size:12px;display:block;margin-bottom:4px}
.fix li{font-size:13px;color:#d6c4a8;margin-bottom:4px}
.anchor{background:#1a2420;border-left:3px solid #4fa87d;border-radius:0 6px 6px 0;
padding:10px 14px;margin:0 0 14px}
.anchor b{color:#7fc79b;font-size:12px;display:block;margin-bottom:5px;
letter-spacing:1px}
.anchor p{margin:0 0 6px;font-size:13.5px;line-height:1.75;color:#cdc0b4}
.anchor p:last-child{margin-bottom:0}
.anchor p+p{color:var(--dim);font-size:13px}
ul{margin:0;padding-left:18px}
ul.notes>li{margin-bottom:12px;font-size:14px;line-height:1.75}
ul.views{margin:6px 0 0;padding-left:16px;border-left:2px solid var(--line)}
/* 符號用絕對定位 + 固定寬度: ▸ 和 ◦ 的字寬不同, 直接放進 :before 當行內內容的話
   兩種句子的文字起點會差幾個 px, 看起來就是沒對齊。 */
ul.views li{position:relative;padding-left:15px;color:var(--dim);font-size:13px;
line-height:1.7;margin-bottom:4px;list-style:none}
ul.views li:before{position:absolute;left:0;top:0;width:13px;
text-align:left;content:"▸";color:var(--gold)}
/* 第二層 (i./ii./iii.) 再縮一階, 保留原文的隸屬關係 */
ul.views li.lv2{margin-left:15px;padding-left:14px;font-size:12.5px}
ul.views li.lv2:before{width:12px;content:"–";color:#6f635a}
ul.views li.lv2.v-mgmt:before{content:"–";color:#5f7f97}
/* 句子本身就以「經營層表示」開頭, 再標一次「公司」是贅字 —— 只留符號與顏色區分 */
ul.views li.v-mgmt:before{content:"◦";color:#7fa8c7}
ul.views li.v-mgmt{color:#9fb4c4}
.anchor p.v-anchor,.anchor p.v-mgmt{position:relative;padding-left:15px}
.anchor p.v-anchor:before{position:absolute;left:0;top:0;width:13px;
content:"▸";color:var(--gold)}
.anchor p.v-mgmt:before{position:absolute;left:0;top:0;width:13px;
content:"◦";color:#7fa8c7}
.anchor p.v-mgmt{color:#9fb4c4}
.stocks{margin-top:12px;border-top:1px solid var(--line)}
.stock{padding:10px 0;border-bottom:1px solid var(--line)}
.stock:last-child{border-bottom:none;padding-bottom:2px}
.sname{font-size:13.5px;font-weight:600;margin-bottom:5px}
.code{color:var(--gold);font-weight:600}
.mets{display:flex;flex-wrap:wrap;gap:4px 6px}
.met{font-size:12px;line-height:1.5;background:#262019;border:1px solid var(--line);
border-radius:5px;padding:2px 7px;white-space:nowrap;max-width:100%}
/* 財測是區間時會很長（70.0~80.0/120.0~130.0 前 70.0~80.0/130.0~140.0），
   不給它換行就會在窄螢幕撐出橫向捲軸。其餘標籤都短，維持不換行比較好讀。 */
.met.fc{white-space:normal;overflow-wrap:anywhere}
.met i{color:var(--dim);font-style:normal;margin-right:5px;font-size:11px}
.met em{color:#6f635a;font-style:normal;margin-left:5px;font-size:11px}
.met.up{color:var(--up);border-color:#4a2f2a}
.met.down{color:var(--down);border-color:#28453a}
.slead{color:var(--dim);font-size:12.5px;line-height:1.65;margin-top:6px}
.manual p{font-size:13.5px;line-height:1.75;margin:0 0 8px;color:var(--fg)}
.brk{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.brk:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.brkhead{color:var(--gold);font-size:12px;letter-spacing:1px;margin-bottom:6px;
text-transform:uppercase}
.brkhead .pub{float:right;text-transform:none;letter-spacing:0}
.card h2 .code{font-size:17px}
a.shot{display:block;margin:12px 0;border:1px solid var(--line);border-radius:8px;
overflow:hidden;background:#fff}
a.shot img{display:block;width:100%;height:auto}
.items{margin:8px 0 4px}
.irow{padding:6px 0;border-bottom:1px solid #2a2420}
.irow:last-child{border-bottom:none}
/* 窄螢幕: 名稱自己一行、內文佔滿寬度。兩欄的話內文只剩 230px, 幾個字就折一行。 */
.ilab{display:block;color:var(--gold);font-size:12.5px;font-weight:600;
margin-bottom:3px}
.ibody{display:block;min-width:0}
/* 夠寬才並排, 而且名稱給**固定寬度** —— 用 auto 的話標籤長短不一,
   內文的起始位置每列都不同, 看起來就是沒對齊。 */
@media (min-width:620px){
  .irow{display:flex;gap:14px;align-items:baseline}
  .ilab{flex:0 0 130px;margin-bottom:0;color:var(--fg)}
  .ibody{flex:1 1 auto}
}
.ist{display:block;color:var(--dim);font-size:12.5px;line-height:1.6}
.ist.up{color:#7fc79b}
.ist.down{color:#e0a06c}
/* 「受惠於什麼」是判斷能不能延續的依據, 所以留著, 但壓成次要層級 */
.idrv{display:block;color:#8a7f75;font-size:12px;line-height:1.55;margin-top:2px}
.facts{margin:10px 0 4px}
/* 三層: 公司 (fhead) -> 分類 (fsub2) -> 資料行。
   公司那層要明顯一級, 否則整封信只看得到 PROFITS / DEMAND 在重複。 */
.fhead{color:var(--gold);font-size:13.5px;font-weight:600;letter-spacing:.5px;
margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.fhead:first-child{margin-top:6px}
.fsub2{color:var(--dim);font-size:11.5px;letter-spacing:1px;margin:12px 0 4px;
text-transform:uppercase}
.fsub2:before{content:"— ";color:#4a423c}
.fsub{color:var(--fg);font-size:12.5px;font-weight:600;margin:9px 0 3px;
opacity:.85}
.fsub:before{content:"— ";color:var(--dim)}
.facts ul.notes>li{margin-bottom:4px;font-size:13px;line-height:1.65;
color:var(--fg)}
.up{color:var(--up)}.down{color:var(--down)}
.empty{color:#6f635a;font-size:13px}
#lock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:40px 0}
#pw{background:var(--card);border:1px solid var(--line);color:var(--fg);
border-radius:8px;padding:9px 12px;font-size:14px;width:200px;outline:none}
#pw:focus{border-color:var(--gold)}
#go{background:var(--gold);border:none;color:#1a1512;border-radius:8px;
padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
#err{color:var(--up);font-size:13px;width:100%}
.sec{color:var(--gold);font-size:13px;letter-spacing:2px;margin:26px 0 10px}
a.row{display:block;background:var(--card);border:1px solid var(--line);
border-radius:8px;padding:10px 14px;margin-bottom:8px;color:var(--fg);
text-decoration:none;font-size:14px}
a.row:hover{border-color:var(--gold)}
a.row .pub{float:right}
a.back{display:inline-block;color:var(--dim);font-size:13px;
text-decoration:none;margin-bottom:18px}
a.back:hover{color:var(--gold)}
/* 首頁兩個來源左右並排, 各佔一半; 窄螢幕 (< 620px) 自動堆疊成上下。
   月份頁裡的 .srcblock 不在 .srcgrid 裡, 所以照舊是整行寬。 */
/* 兩欄永遠各佔一半, 手機也不換行 —— 內容只有「08 月 / 19 篇」這種短字串,
   窄螢幕塞得下, 上下堆疊反而要捲。 */
.srcgrid{display:flex;gap:10px;align-items:flex-start}
.srcgrid>.srcblock{flex:1 1 0;min-width:0;margin-bottom:0;padding:2px 10px 12px}
.srcgrid>.srcblock .sec{font-size:12px;letter-spacing:0;word-break:break-word}
.srcgrid>.srcblock a.row{padding:9px 10px;font-size:13px}
.srcgrid>.srcblock a.row .pub{float:none;display:block;margin-top:2px}
.srcblock{border:1px solid var(--line);border-radius:12px;padding:2px 14px 14px;
margin-bottom:22px;background:#191513}
.srcblock>.sec{margin-top:16px;padding-bottom:8px;
border-bottom:1px solid var(--line)}
.srcblock>.sec span{color:var(--dim);font-size:12px;letter-spacing:0}
.srcblock .card{background:#221d1a}
details.recent{margin-top:34px;border-top:1px solid var(--line);padding-top:6px}
details.recent>summary{color:var(--dim);font-size:13px;letter-spacing:1px;
cursor:pointer;padding:10px 0;list-style:none;user-select:none}
details.recent>summary::-webkit-details-marker{display:none}
details.recent>summary:before{content:"▸ ";color:var(--gold)}
details.recent[open]>summary:before{content:"▾ "}
details.recent>summary:hover{color:var(--gold)}

// 兩層記憶, 為了「只在第一次進來時輸入密碼」:
//   KEYCACHE (sessionStorage) 存推導好的金鑰 —— 同一個分頁換頁時瞬間解開
//   PWCACHE  (localStorage)   存密碼本身 —— 關掉瀏覽器、換分頁、隔天再來都還在
// 為什麼不是把金鑰存 localStorage 就好: 每次重新產站都會換一組新的 salt,
// 存金鑰的話一有更新就失效、又要重打; 存密碼則可以用新 salt 重新推導。
// 代價是密碼以明文躺在這台瀏覽器的 localStorage 裡 —— 共用裝置就別讓它記。
const KEYCACHE="invest_note_key", PWCACHE="invest_note_pw";
const enc=new TextEncoder(), dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const $=id=>document.getElementById(id);

async function keyFromPassword(pw){
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",
                                         false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64d(P.s),iterations:ITER,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function reveal(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(P.i)},key,b64d(P.c));
  $("content").innerHTML=dec.decode(pt);
  $("lock").style.display="none";
  // 頁內錨點要等內容注入之後才存在
  if(location.hash){const t=$(location.hash.slice(1)); if(t)t.scrollIntoView();}
}
function remember(pw,key){
  try{sessionStorage.setItem(KEYCACHE,b64e(key));}catch(e){}
  try{localStorage.setItem(PWCACHE,pw);}catch(e){}
}
function forget(){
  try{sessionStorage.removeItem(KEYCACHE);}catch(e){}
  try{localStorage.removeItem(PWCACHE);}catch(e){}
}
async function tryCached(){
  // 1) 同分頁的金鑰快取: 最快, salt 沒換的話直接開
  let raw=null;
  try{raw=sessionStorage.getItem(KEYCACHE);}catch(e){}
  if(raw){
    try{
      await reveal(await crypto.subtle.importKey("raw",b64d(raw),{name:"AES-GCM"},
                                                 true,["decrypt"]));
      return true;
    }catch(e){
      try{sessionStorage.removeItem(KEYCACHE);}catch(e2){}   // salt 換過了
    }
  }
  // 2) 記住的密碼: 用這一頁的 salt 重新推導, 所以更新過也解得開
  let pw=null;
  try{pw=localStorage.getItem(PWCACHE);}catch(e){}
  if(!pw)return false;
  $("err").textContent="解鎖中 ...";
  try{
    const key=await keyFromPassword(pw);
    await reveal(key);
    remember(pw,await crypto.subtle.exportKey("raw",key));
    $("err").textContent="";
    return true;
  }catch(e){
    forget();                                   // 密碼改過了, 清掉重問
    $("err").textContent="";
    return false;
  }
}
async function submit(){
  const pw=$("pw").value;
  if(!pw)return;
  $("err").textContent="解鎖中 ...";
  try{
    const key=await keyFromPassword(pw);
    await reveal(key);
    remember(pw,await crypto.subtle.exportKey("raw",key));
  }catch(e){
    $("err").textContent="密碼不對";
    $("pw").value="";
    $("pw").focus();
  }
}
$("go").addEventListener("click",submit);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
tryCached().then(ok=>{if(!ok)$("pw").focus();});
</script></body></html>
